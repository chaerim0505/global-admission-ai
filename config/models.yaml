# 모델 설정 — 정본. 코드와 문서는 모델 ID를 하드코딩하지 않고 이 파일을 읽는다.
# 원칙: 최신 Gemini 모델을 쓰되 "-latest" 별칭 대신 버전 ID를 고정한다.
#   (별칭은 새 릴리스 때 자동으로 바뀌어 같은 골든 케이스·evals 결과를 재현할 수 없다)
# 모델을 바꿀 때: 이 파일 수정 → 골든 케이스·evals 재실행 → 이전 결과와 정확도·비용·지연 비교 → 변경 이력에 기록
# 확인일: 2026-10-07 (https://ai.google.dev/gemini-api/docs/models)
provider: vertex_ai   # 로컬 실험은 Gemini API(GEMINI_API_KEY)

models:
  request_parser:            # 사용자 발화 -> RequestContext (src/global_admission/prompts/parse_query.md)
    id: gemini-3.8-flash     # 최신 stable Flash
    temperature: 0
  requirement_extractor:     # 공식 페이지 -> AdmissionRequirement/Program (docs/spikes/requirement_extraction)
    id: gemini-3.8-flash
    temperature: 0
  agent:                     # Root Agent 도구 호출, 결과 설명 (ADK)
    id: gemini-3.8-flash
    temperature: 0.2
  embedding:                 # Vector Search, 교수-관심분야 유사도
    id: gemini-embedding-2-preview   # 최신(preview). 운영 불안정 시 gemini-embedding-001(stable)로 대체
  comparison_only:           # 스파이크·evals 비교용. preview라 배포 경로에는 쓰지 않는다
    id: gemini-3.1-pro-preview

# 요건 판정(충족/미충족/확인 필요)은 모델이 아니라 규칙 코드가 한다 (docs/spikes/ielts_threshold.md)

# 변경 이력
# - 2026-10-07: 최초 작성. 스파이크의 gemini-2.5-flash(신규 프로젝트 사용 제한)를 gemini-3.8-flash로 교체.
